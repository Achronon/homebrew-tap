name: Update cvps formula

# Self-contained tap updater: org policy disables deploy keys and the old
# cross-repo HOMEBREW_TAP_TOKEN PAT is dead, so instead of Achronon/cvps CI
# pushing here, this repo polls the public releases API and bumps its own
# formula using the repo-scoped GITHUB_TOKEN (no secrets required).
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bump formula to latest cvps release
        run: |
          set -euo pipefail

          TAG=$(curl -fsSL https://api.github.com/repos/Achronon/cvps/releases/latest | python3 -c "import json,sys; print(json.load(sys.stdin)['tag_name'])")
          VERSION="${TAG#v}"

          CURRENT=$(grep -m1 -oE 'version "[^"]+"' Formula/cvps.rb | cut -d'"' -f2 || echo none)
          if [[ "$CURRENT" == "$VERSION" ]]; then
            echo "Formula already at ${VERSION}; nothing to do."
            exit 0
          fi

          BASE_URL="https://github.com/Achronon/cvps/releases/download/${TAG}"
          for asset in darwin-arm64 darwin-amd64 linux-arm64 linux-amd64; do
            curl -fsSL "${BASE_URL}/cvps-${asset}" -o "/tmp/cvps-${asset}"
          done

          DARWIN_ARM64_SHA="$(sha256sum /tmp/cvps-darwin-arm64 | awk '{print $1}')"
          DARWIN_AMD64_SHA="$(sha256sum /tmp/cvps-darwin-amd64 | awk '{print $1}')"
          LINUX_ARM64_SHA="$(sha256sum /tmp/cvps-linux-arm64 | awk '{print $1}')"
          LINUX_AMD64_SHA="$(sha256sum /tmp/cvps-linux-amd64 | awk '{print $1}')"

          curl -fsSL "https://raw.githubusercontent.com/Achronon/cvps/${TAG}/docs/homebrew-formula.rb" -o /tmp/template.rb

          sed \
            -e "s/version \"1.0.0\"/version \"${VERSION}\"/" \
            -e "s/PLACEHOLDER_SHA256_ARM64/${DARWIN_ARM64_SHA}/" \
            -e "s/PLACEHOLDER_SHA256_AMD64/${DARWIN_AMD64_SHA}/" \
            -e "s/PLACEHOLDER_SHA256_LINUX_ARM64/${LINUX_ARM64_SHA}/" \
            -e "s/PLACEHOLDER_SHA256_LINUX_AMD64/${LINUX_AMD64_SHA}/" \
            /tmp/template.rb > Formula/cvps.rb

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/cvps.rb
          if git diff --cached --quiet; then
            echo "No formula changes after regeneration."
            exit 0
          fi
          git commit -m "cvps ${TAG}"
          git push origin main
